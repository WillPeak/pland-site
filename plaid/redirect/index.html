<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pland — returning to app</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 2rem; color: #111; }
    a { color: #0a66c2; }
  </style>
</head>
<body>
  <h1>Opening Pland…</h1>
  <p>If the app doesn’t open automatically, tap below to finish linking your bank.</p>
  <p><a id="open-pland" href="pland://plaid/redirect">Open Pland</a></p>
  <script>
    (function () {
      var q = window.location.search || "";
      var deep = "pland://plaid/redirect" + q;
      var a = document.getElementById("open-pland");
      if (a) a.href = deep;
      // Fallback if Universal Links did not claim https://pland.ai/plaid/redirect
      window.location.replace(deep);
    })();
  </script>
</body>
</html>
