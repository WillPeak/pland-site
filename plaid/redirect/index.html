<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pland — returning to app</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 2rem; color: #111; }
    a { color: #0a66c2; }
  </style>
</head>
<body>
  <h1>Returning to Pland…</h1>
  <p>If you’re not taken back into the app automatically, tap below.</p>
  <p><a id="open-pland" href="pland://plaid/redirect">Open Pland</a></p>
  <script>
    (function () {
      var q = window.location.search || "";
      var a = document.getElementById("open-pland");
      if (a) a.href = "pland://plaid/redirect" + q;
      // Do NOT auto-redirect to pland:// — LinkKit 6+ expects the https
      // Universal Link (pland.ai/plaid/redirect) and handles OAuth itself.
    })();
  </script>
</body>
</html>
