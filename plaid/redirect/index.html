<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pland — returning to app</title>
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.pland.ai; form-action 'self' mailto: https://api.pland.ai; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" />
  <link rel="stylesheet" href="/plaid/redirect.css" />
</head>
<body>
  <h1>Returning to Pland…</h1>
  <p>If you’re not taken back into the app automatically, tap below.</p>
  <p><a id="open-pland" href="pland://plaid/redirect">Open Pland</a></p>
  <script src="/plaid/redirect.js"></script>
</body>
</html>
